# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the daemon. 2 GB is tight once R8 and the Kotlin compiler run in
# the same daemon; the parallel collector is Gradle's recommendation for build JVMs,
# which are throughput-bound rather than latency-bound.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build :app and :easy-circle-flags concurrently where the task graph allows.
org.gradle.parallel=true

# Reuse task outputs across builds and branches, not just within one build.
org.gradle.caching=true

# Skip re-running the configuration phase when nothing about the build scripts
# changed. Verified compatible with this project: a no-op :app:assembleRelease goes
# from ~14s to under 1s on a cache hit.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
